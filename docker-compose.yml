# MercadoVerde — orquestación de la solución en contenedores.
#
#   docker compose up --build
#
# Los puertos del host son configurables (variables de entorno o archivo .env):
#   API_PORT (def. 5080) · WEB_PORT (def. 3000) · DB_PORT (def. 5433)
# Cambiar un puerto reajusta automáticamente la URL de la API en el panel
# (NEXT_PUBLIC_API_BASE) y el origen permitido por CORS en la API.
#
# Servicios:
#   db  → PostgreSQL 16
#   api → ASP.NET Core 8 (Swagger en /swagger)
#   web → Next.js / panel de soporte

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mercadoverde
      POSTGRES_PASSWORD: mercadoverde
      POSTGRES_DB: mercadoverde
    ports:
      # Solo para inspección con un cliente de BD desde el host. El 'api' se
      # conecta por la red interna (Host=db), no por este puerto.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercadoverde -d mercadoverde"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: src/MercadoVerde.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=mercadoverde;Username=mercadoverde;Password=mercadoverde"
      # Origen del panel permitido por CORS (debe coincidir con WEB_PORT).
      Cors__AllowedOrigin: "http://localhost:${WEB_PORT:-3000}"
      # Zona del servidor de aplicación (coincide con los logs de producción).
      TZ: "America/El_Salvador"
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL de la API tal como la ve el NAVEGADOR del usuario (debe coincidir
        # con API_PORT). Se embebe en build: si cambias el puerto, reconstruye
        # con `docker compose up --build`.
        NEXT_PUBLIC_API_BASE: "http://localhost:${API_PORT:-5080}"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
